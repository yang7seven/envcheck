[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "envcheck"
version = "1.0.0"
description = "Dev environment doctor — one command to check your entire dev setup"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["devtools", "environment", "doctor", "cli", "onboarding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
]

[project.scripts]
envcheck = "envcheck.cli:app"

[project.urls]
Homepage = "https://github.com/yang7seven/envcheck"
Repository = "https://github.com/yang7seven/envcheck"
Issues = "https://github.com/yang7seven/envcheck/issues"

[tool.setuptools.packages.find]
where = ["src"]